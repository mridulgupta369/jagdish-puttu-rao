<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jagdish Puttu Rao</title>
  <meta name="description" content="The life of Jagdish Puttu Rao: Peradi, Bombay, Dubai, Bangalore, and a farm of his own, soon.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#070a19">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23070a19'/%3E%3Ccircle cx='32' cy='36' r='13' fill='%23e9bf6e'/%3E%3Cpath d='M12 46h40' stroke='%23070a19' stroke-width='9'/%3E%3Cpath d='M12 45h40' stroke='%23e9bf6e' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&amp;family=Jost:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="preloader" aria-hidden="true">
    <div class="preloader__inner">
      <div class="preloader__sun"></div>
      <div class="preloader__line"><i></i></div>
      <div class="preloader__label">Gathering memories</div>
    </div>
  </div>

  <!-- The stage: sky, scenery and people. Everything here is painted by the scroll timeline (js/main.js). -->
  <div class="stage" id="stage" aria-hidden="true">
    <div class="sky" id="sky"></div>
    <div class="sky-glow" id="skyGlow"></div>
    <canvas class="fx-canvas" id="skyCanvas"></canvas>
    <div class="celestial" id="celestial">
      <div class="sun" id="sun"></div>
      <div class="moon" id="moon"></div>
    </div>
    <div class="clouds" id="clouds"></div>
    <div class="scene" id="scene-village"><div class="scene__cam"></div></div>
    <div class="scene" id="scene-mumbai"><div class="scene-sky"></div><div class="scene__cam"></div></div>
    <div class="scene" id="scene-dubai"><div class="scene__cam"></div></div>
    <div class="scene" id="scene-world"><canvas class="globe-canvas" id="globe"></canvas></div>
    <div class="scene" id="scene-bangalore"><div class="scene__cam"></div></div>
    <div class="scene" id="scene-farm"><div class="scene__cam"></div></div>
    <div class="cast" id="cast"></div>
    <div class="tags" id="tags"></div>
    <div class="transit" id="transit"></div>
    <canvas class="fx-canvas" id="rainCanvas"></canvas>
  </div>

  <div class="postcards" id="postcards"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Chapter text. Built from js/story.js. -->
  <main class="story" id="story"></main>

  <canvas class="genie" id="genie" aria-hidden="true"></canvas>
  <div class="genie-fx" id="genieFx" aria-hidden="true"></div>

  <header class="hud" id="hud">
    <a class="hud__brand" href="#" id="brand" aria-label="Back to the beginning">
      <span class="hud__mono" id="mono"></span>
      <span class="hud__name" id="brandName"></span>
    </a>
    <div class="hud__right">
      <button class="hud__play" id="playBtn" type="button" aria-pressed="false" aria-label="Play the story automatically">
        <span class="ico" aria-hidden="true"></span><span class="lbl">Play</span>
      </button>
      <div class="hud__year">
        <div class="odo" id="odo" aria-hidden="true"></div>
        <div class="hud__meta"><span id="hudPlace">Peradi</span><span class="sep">·</span><span id="hudAge">Born</span></div>
      </div>
    </div>
  </header>

  <nav class="journey" id="journey" aria-label="Stops on the journey">
    <div class="journey__track" id="track">
      <div class="journey__road"></div>
      <div class="journey__fill"></div>
      <ol class="stops" id="stops"></ol>
      <div class="vehicle" id="vehicle">
        <div class="vehicle__flip"><div class="headlight"></div><div class="vehicle__bob" id="vehicleBob"></div></div>
      </div>
    </div>
  </nav>

  <div class="scroll-space" id="space" aria-hidden="true"></div>
  <p class="sr-only" id="live" aria-live="polite"></p>

  <noscript><div class="nojs">This story is told with animation. Please turn on JavaScript to see it.</div></noscript>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/ScrollTrigger.min.js"></script>
  <script src="js/vendor/lenis.min.js"></script>
  <script src="js/data/land.js"></script>
  <script src="js/story.js"></script>
  <script src="js/art-figures.js"></script>
  <script src="js/art-scenes.js"></script>
  <script src="js/art-postcards.js"></script>
  <script src="js/art-vehicles.js"></script>
  <script src="js/art-karnataka.js"></script>
  <script src="js/art-dream.js"></script>
  <script src="js/art-photos.js"></script>
  <script src="js/art-bus.js"></script>
  <script src="js/globe.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/genie.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
